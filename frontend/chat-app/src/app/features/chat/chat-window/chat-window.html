<div class="flex flex-col h-full">

  @if (isLoading()) {
  <div class="flex-1 flex items-center justify-center">
    <span class="loading loading-spinner loading-lg"></span>
  </div>
  } @else {

  <!-- Mensajes -->
  <div class="flex-1 overflow-y-auto p-4 flex flex-col gap-2">
    @for (message of messages(); track message.id) {
    <div class="flex" [class.justify-end]="isMine(message)">
      <div class="max-w-xs md:max-w-md rounded-2xl px-4 py-2" [class.bg-primary]="isMine(message)"
        [class.text-primary-content]="isMine(message)" [class.bg-base-200]="!isMine(message)">
        @if (!isMine(message)) {
        <p class="text-xs font-semibold opacity-70 mb-0.5">{{ message.senderUsername }}</p>
        }
        <p class="whitespace-pre-wrap wrap-break-words">{{ message.content }}</p>
        <p class="text-[10px] opacity-60 text-right mt-0.5">
          {{ message.sentAt | date: 'HH:mm' }}
        </p>
      </div>
    </div>
    } @empty {
    <p class="text-center text-base-content/60 py-10">
      Todavía no hay mensajes. ¡Escribí el primero!
    </p>
    }
    <div #messagesEnd></div>
  </div>

  <!-- Input para enviar -->
  <div class="p-3 border-t border-base-300 flex gap-2">
    <input type="text" [(ngModel)]="newMessageText" (keyup.enter)="sendMessage()" placeholder="Escribí un mensaje..."
      class="input input-bordered flex-1" [disabled]="isSending()" />
    <button class="btn btn-primary" (click)="sendMessage()" [disabled]="isSending() || !newMessageText.trim()">
      @if (isSending()) {
      <span class="loading loading-spinner loading-xs"></span>
      } @else {
      Enviar
      }
    </button>
  </div>

  }
</div>
