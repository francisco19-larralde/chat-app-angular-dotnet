<div class="min-h-screen flex items-center justify-center bg-base-200 px-4">
  <div class="card w-full max-w-sm bg-base-100 shadow-xl">
    <div class="card-body">
      <h2 class="text-2xl font-bold text-center mb-2">Iniciar sesión</h2>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-3">

        <div>
          <label class="label"><span class="label-text">Email</span></label>
          <input type="email" formControlName="email" class="input input-bordered w-full" placeholder="tu@email.com" />
          @if (form.get('email')?.touched && form.get('email')?.invalid) {
          <span class="text-error text-xs mt-1">Ingresá un email válido</span>
          }
        </div>

        <div>
          <label class="label"><span class="label-text">Contraseña</span></label>
          <input type="password" formControlName="password" class="input input-bordered w-full"
            placeholder="••••••••" />
          @if (form.get('password')?.touched && form.get('password')?.invalid) {
          <span class="text-error text-xs mt-1">La contraseña es obligatoria</span>
          }
        </div>

        @if (errorMessage()) {
        <div class="alert alert-error text-sm py-2">{{ errorMessage() }}</div>
        }

        <button type="submit" class="btn btn-primary w-full mt-2" [disabled]="isLoading()">
          @if (isLoading()) {
          <span class="loading loading-spinner loading-sm"></span>
          } @else {
          Ingresar
          }
        </button>
      </form>

      <div class="divider">o</div>

      <div id="googleSignInButton" class="flex justify-center "></div>

      <p class="text-center text-sm mt-4">
        ¿No tenés cuenta?
        <a routerLink="/register" class="link link-primary">Registrate</a>
      </p>
    </div>
  </div>
</div>
