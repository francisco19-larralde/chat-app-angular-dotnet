<div class="max-w-md mx-auto p-4">
  <h2 class="text-xl font-bold mb-4">Crear grupo</h2>

  <input type="text" [(ngModel)]="groupName" placeholder="Nombre del grupo" class="input input-bordered w-full mb-4" />

  <p class="text-sm font-medium mb-2">Elegí los miembros:</p>

  <div class="flex flex-col gap-2 max-h-80 overflow-y-auto mb-4">
    @for (friend of friends(); track friend.userId) {
    <label class="flex items-center gap-3 p-2 rounded-lg hover:bg-base-200 cursor-pointer">
      <input type="checkbox" class="checkbox checkbox-primary" [checked]="isSelected(friend.userId)"
        (change)="toggleMember(friend.userId)" />
      <div class="avatar">
        <div class="w-8 rounded-full bg-neutral overflow-hidden">
          @if (getImageUrl(friend.profilePictureUrl); as url) {
          <img [src]="url" class="w-full h-full object-cover" />
          }
        </div>
      </div>
      <span>{{ friend.username }}</span>
    </label>
    } @empty {
    <p class="text-sm text-base-content/60">
      Todavía no tenés amigos agregados. Andá a "Amigos" primero.
    </p>
    }
  </div>

  @if (errorMessage()) {
  <div class="alert alert-error text-sm py-2 mb-3">{{ errorMessage() }}</div>
  }

  <button class="btn btn-primary w-full" (click)="createGroup()" [disabled]="isCreating()">
    @if (isCreating()) {
    <span class="loading loading-spinner loading-sm"></span>
    } @else {
    Crear grupo
    }
  </button>
</div>
