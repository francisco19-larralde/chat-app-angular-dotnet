<aside class="h-full flex flex-col bg-base-100">
  <div class="p-4 border-b border-base-300">
    <h1 class="hidden md:block text-xl font-bold">ChatApp</h1>
  </div>

  <div class="flex-1 overflow-y-auto">
    <p class="p-4 text-sm text-base-content/60 hidden md:block">
      Próximamente: lista de chats
    </p>
  </div>

  <div class="p-3 border-t border-base-300 flex items-center gap-3">
    <div class="avatar">
      <div class="w-10 rounded-full bg-neutral"></div>
    </div>
    <span class="hidden md:block text-sm font-medium">{{ user()?.username }}</span>
    <button (click)="logout()">Cerrar sesión</button>
  </div>
</aside>
