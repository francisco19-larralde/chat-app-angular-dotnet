<div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4" (click)="onBackdropClick($event)">
  <div class="bg-base-100 rounded-2xl overflow-hidden w-full max-w-sm shadow-2xl">

    @if (isLoading()) {
    <div class="h-64 flex items-center justify-center">
      <span class="loading loading-spinner loading-lg"></span>
    </div>
    } @else if (profile(); as p) {

    <!-- Portada -->
    <div class="h-28 bg-base-300 relative">
      @if (getImageUrl(p.coverPictureUrl); as coverUrl) {
      <img [src]="coverUrl" class="w-full h-full object-cover" />
      }@else {
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"
        stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M3 16.5V19a2 2 0 002 2h14a2 2 0 002-2v-2.5M7 10l5-5m0 0l5 5m-5-5v12" />
      </svg>
      }
      <button class="absolute top-2 right-2 btn btn-circle btn-sm bg-base-100/80 border-none" (click)="close.emit()">
        ✕
      </button>
    </div>

    <div class="px-5 pb-5">
      <div class="avatar -mt-10 mb-2" [class.avatar-online]="p.isOnline" [class.avatar-offline]="!p.isOnline">
        <div class="w-20 rounded-full ring ring-base-100 ring-offset-0 bg-neutral overflow-hidden">
          @if (getImageUrl(p.profilePictureUrl); as picUrl) {
          <img [src]="picUrl" class="w-full h-full object-cover" />
          }@else {
          <div class="flex h-full w-full items-center justify-center text-base-content/30">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" fill="none" viewBox="0 0 24 24"
              stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M15.75 7.5a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.5 20.25a8.25 8.25 0 0115 0" />
            </svg>
          </div>
          }
        </div>
      </div>

      <h3 class="text-lg font-bold">{{ p.username }}</h3>
      <p class="text-sm text-base-content/60 mb-4">
        {{ p.isOnline ? 'En línea' : 'Desconectado' }}
      </p>

      <button class="btn btn-primary w-full" (click)="startChat()" [disabled]="isStartingChat()">
        @if (isStartingChat()) {
        <span class="loading loading-spinner loading-sm"></span>
        } @else {
        💬 Enviar mensaje
        }
      </button>
    </div>

    } @else {
    <div class="p-6 text-center text-base-content/60">
      No se pudo cargar el perfil.
    </div>
    }

  </div>
</div>
